<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c150f"><title>HORSE DAYS — リアル3Dレース観戦</title><link rel="stylesheet" href="race3d.css?v=motion2"></head><body><main>
<header><div><small>HORSE DAYS · COURSE LAB</small><h1>青空グランプリ <b>試走</b></h1></div><a href="./">馬の試作へ</a></header>
<p class="meta">芝2000m · 17頭 · 内側にダートコース</p><div id="ground-board" class="race-ground-board" hidden><span class="ground-board-label">馬場状態</span><strong id="ground-status" aria-live="polite"></strong></div><div class="info"><span id="time">時計 0:00.0</span><strong id="remaining">残り 2000m</strong></div><div class="progress"><i id="progress"></i></div>
<section id="race-stage"><canvas id="race3d" aria-label="17頭のレース"></canvas><canvas id="course-labels" aria-hidden="true"></canvas><span id="shot">発走</span><span id="horse-label" hidden></span><aside id="elevation-profile" aria-label="コースの高低差と現在位置"><span class="elevation-caption">高低差 0.0m　平坦</span><canvas aria-hidden="true"></canvas></aside><div id="error" hidden role="alert"></div></section>
<section class="field-position" aria-label="馬番で見る隊列"><div class="field-position-heading"><span>隊列</span><span>先頭 →</span></div><canvas id="map" aria-label="枠色の丸い馬番で示す各馬の前後・内外の位置"></canvas></section>
<section class="live"><small>LIVE · レース実況</small><button id="voice-toggle" type="button" aria-label="実況の読み上げを切り替える">実況音声：オン</button><p id="commentary" aria-live="polite">ゲートにそろいました。</p></section>
<nav id="camera-buttons" aria-label="カメラの向きを選ぶ"></nav>
<div class="actions"><button id="pause">一時停止</button><button id="speed">速度 ×1</button><button id="follow">注目馬を追う</button><button id="again">最初から</button></div>
<label class="seek-label" for="seek">再生位置</label><input id="seek" type="range" min="0" max="130" step=".1" value="0" aria-label="試走の再生位置">
<div id="field" aria-label="馬を選ぶ"></div>
<footer>カメラとコースを確かめる立体の試走です。育成データには影響しません。<br><a href="race-2d.html">前のイラスト版</a> · <a href="../../">本編へ</a></footer>
