/* HORSEDAYS_COMPRESSED_STORAGE_V1
 * SaveStore calls into this synchronous bridge from BrowserSave.jslib.
 * localStorage quota may be insufficient for large GameState JSON documents.
 * A reversible LZW codec keeps the API synchronous without delaying saves.
 * It reads uncompressed legacy saves unchanged and only replaces the value
 * after a successful localStorage.setItem; failed writes retain the old save.
 */
(function () {
  'use strict';
  var MARKER = 'HDLZW1:';
  var MAX_EXPANDED_BYTES = 32 * 1024 * 1024;
  var KEY = 'horsedays.stable.v1';
  var encoder = new TextEncoder();
  var decoder = new TextDecoder('utf-8', { fatal: true });

  function bytesToBase64(bytes) {
    var parts = [];
    for (var i = 0; i < bytes.length; i += 8192) {
      var slice = bytes.subarray(i, i + 8192);
      var bin = '';
      for (var j = 0; j < slice.length; j++) bin += String.fromCharCode(slice[j]);
      parts.push(bin);
    }
    // btoa on huge strings may cause stack/memory issues; process chunks.
    var result = [];
    var pending = '';
    for (var p = 0; p < parts.length; p++) {
      pending += parts[p];
      var used = pending.length - (pending.length % 3);
      if (used) { result.push(btoa(pending.slice(0, used))); pending = pending.slice(used); }
    }
    if (pending) result.push(btoa(pending));
    return result.join('');
  }

  function lzwCompress(text) {
    var source = encoder.encode(text);
    if (source.length > MAX_EXPANDED_BYTES) throw new Error('Save exceeds the 32MiB safety limit');
    if (source.length === 0) return MARKER + '0:';
    var dictionary = new Map();
    var codes = [];
    var word = source[0];
    var nextCode = 256;
    for (var i = 1; i < source.length; i++) {
      var character = source[i];
      var key = word * 256 + character;
      var hit = dictionary.get(key);
      if (hit !== undefined) word = hit;
      else {
        codes.push(word);
        if (nextCode < 65536) dictionary.set(key, nextCode++);
        word = character;
      }
    }
    codes.push(word);
    var packed = new Uint8Array(codes.length * 2);
    for (var c = 0; c < codes.length; c++) {
      packed[c * 2] = codes[c] >>> 8;
      packed[c * 2 + 1] = codes[c] & 255;
    }
    return MARKER + source.length.toString(36) + ':' + bytesToBase64(packed);
  }

  function lzwDecompress(data) {
    if (typeof data !== 'string' || data.slice(0, MARKER.length) !== MARKER) return data;
    var split = data.indexOf(':', MARKER.length);
    if (split < 0) throw new Error('Corrupt save header');
    var expected = parseInt(data.slice(MARKER.length, split), 36);
    if (!Number.isSafeInteger(expected) || expected < 0 || expected > MAX_EXPANDED_BYTES)
      throw new Error('Invalid saved data size');
    var encoded = data.slice(split + 1);
    if (expected === 0 && encoded === '') return '';
    var raw = atob(encoded);
    if (!raw.length || raw.length % 2) throw new Error('Corrupt compressed save');
    var size = raw.length / 2;
    var out = new Uint8Array(expected);
    var prefix = new Uint16Array(65536);
    var suffix = new Uint8Array(65536);
    var stack = new Uint8Array(65536);
    var nextCode = 256;
    var current = (raw.charCodeAt(0) << 8) | raw.charCodeAt(1);
    if (current > 255 || expected < 1) throw new Error('Invalid first save code');
    out[0] = current;
    var offset = 1;
    var previous = current;

    for (var at = 1; at < size; at++) {
      current = (raw.charCodeAt(at * 2) << 8) | raw.charCodeAt(at * 2 + 1);
      var count = 0;
      var cursor = current;
      var special = current === nextCode && nextCode < 65536;
      if (special) cursor = previous;
      else if (current >= nextCode) throw new Error('Invalid save code');
      while (cursor >= 256) {
        if (count >= stack.length) throw new Error('Overlong save dictionary entry');
        stack[count++] = suffix[cursor];
        cursor = prefix[cursor];
      }
      stack[count++] = cursor;
      var first = cursor;
      var needed = count + (special ? 1 : 0);
      if (offset + needed > expected) throw new Error('Expanded save length overflow');
      while (count) out[offset++] = stack[--count];
      if (special) out[offset++] = first;
      if (nextCode < 65536) {
        prefix[nextCode] = previous;
        suffix[nextCode] = first;
        nextCode++;
      }
      previous = current;
    }
    if (offset !== expected) throw new Error('Expanded save size mismatch');
    return decoder.decode(out);
  }

  function notifySaveError(error) {
    var name = error && error.name ? String(error.name) : 'StorageError';
    var quota = name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED';
    var text = quota
      ? 'HorseDays: セーブ容量が上限に達しました。既存データは削除せず、このエラーを報告してください。'
      : 'HorseDays: ブラウザの保存が利用できません。通常モードで開き、サイトデータの保存が許可されているか確認してください。';
    window.HorseDaysLastSaveError = { name: name, message: String(error && error.message || error), time: Date.now() };
    console.error('HorseDays persistent save failed:', error);
    var existing = document.getElementById('horsedays-storage-error');
    if (!existing) {
      existing = document.createElement('div');
      existing.id = 'horsedays-storage-error';
      existing.style.cssText = 'position:fixed;left:8px;right:8px;bottom:12px;z-index:2147483646;background:#8e2323;color:#fff;padding:12px;border-radius:10px;font:14px/1.5 sans-serif;box-shadow:0 4px 18px #0007';
      document.body.appendChild(existing);
    }
    existing.textContent = text + ' (' + name + ')';
  }

  window.horseDaysStorage = {
    read: function (key) {
      var raw = localStorage.getItem(key || KEY);
      return raw ? lzwDecompress(raw) : '';
    },
    readBackup: function (slot) {
      var key = KEY + '.backup.' + String(slot);
      var raw = localStorage.getItem(key);
      return raw ? lzwDecompress(raw) : '';
    },
    write: function (key, value) {
      if (typeof value !== 'string') throw new TypeError('HorseDays save must be a string');
      var storageKey = key || KEY;
      try {
        var compressed = lzwCompress(value);
        var payload = compressed.length < value.length ? compressed : value;
        // setItem is atomic with respect to quota failure. Never delete the old save.
        localStorage.setItem(storageKey, payload);
        window.HorseDaysLastSaveError = null;
        var errorBox = document.getElementById('horsedays-storage-error');
        if (errorBox) errorBox.remove();
      } catch (e) {
        notifySaveError(e);
        throw e; // BrowserSave.jslib interprets this as failure rather than success.
      }
    }
  };
})();

</script>

  <script>
/* HD_NATIVE_INPUT_BRIDGE_V1
 * Unity WebGL's IMGUI labels are not HTML <input> elements.
 * Open a native, touch-friendly browser input when Unity invokes
 * HorseDaysIdentityInput through Assets/Plugins/WebGL/StableIdentity.jslib.
 */
(function () {
  "use strict";
  var unityGameObject = "Horse Days";
  var inputKinds = {
    ReceiveStableName: {title: "牧場名を入力", placeholder: "牧場名（24文字以内）"},
    ReceivePartnerName: {title: "馬の名前を入力", placeholder: "馬名（18文字以内）"},
    ReceiveFoalName: {title: "産駒の名前を入力", placeholder: "馬名（18文字以内）"},
    ReceiveMobileHorseSearch: {title: "馬名を検索", placeholder: "検索する馬名"}
  };
  var game = null;

  if (window.HorseDaysUnityPromise && typeof window.HorseDaysUnityPromise.then === "function") {
    window.HorseDaysUnityPromise.then(function (instance) {
      game = instance;
      window.HorseDaysUnityInstance = instance;
    }).catch(function (error) {
      console.error("HorseDays Unity initialization failed:", error);
    });
  }

  function send(functionName, value) {
    var instance = game || window.HorseDaysUnityInstance;
    if (!instance || typeof instance.SendMessage !== "function") {
      console.error("HorseDays Unity instance is unavailable for", functionName);
      return false;
    }
    instance.SendMessage(unityGameObject, functionName, value);
    return true;
  }

  function makeModal() {
    modal = document.createElement("div");
    modal.id = "horse-days-native-input";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("aria-label", "HorseDays 文字入力");
    modal.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(8,19,15,.77);font-family:system-ui,-apple-system,Meiryo,sans-serif;";
    modal.innerHTML = '<div style="box-sizing:border-box;width:100%;max-width:420px;padding:22px 18px 18px;border-radius:20px;background:#fffaf0;color:#22392e;box-shadow:0 14px 60px rgba(0,0,0,.4)">' +
      '<div data-role="title" style="font-size:20px;font-weight:700;margin-bottom:14px"></div>' +
      '<form data-role="form" autocomplete="off">' +
      '<input data-role="input" type="text" maxlength="24" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" style="box-sizing:border-box;width:100%;min-height:54px;padding:12px;border:2px solid #789c75;border-radius:12px;background:#fff;color:#152b1d;font-size:18px;outline-offset:2px;font-family:inherit" />' +
      '<div data-role="error" aria-live="polite" style="min-height:20px;margin:7px 2px 2px;font-size:13px;color:#a82424"></div>' +
      '<div style="display:flex;gap:10px;margin-top:14px">' +
      '<button data-role="cancel" type="button" style="flex:1;min-height:48px;border:1px solid #c2c6bd;border-radius:12px;background:#edf0e8;color:#334638;font-size:16px;font-weight:600">キャンセル</button>' +
      '<button data-role="save" type="submit" style="flex:1;min-height:48px;border:0;border-radius:12px;background:#35764d;color:white;font-size:16px;font-weight:700">決定</button></div>' +
      '</form></div>';
    input = modal.querySelector('[data-role="input"]');
    var error = modal.querySelector('[data-role="error"]');

    modal.addEventListener("keydown", function (event) {
      // Prevent Unity WebGL from consuming the browser input's keystrokes.
      event.stopPropagation();
      if (event.key === "Escape") { event.preventDefault(); close(); }
    }, true);
    modal.addEventListener("keyup", function (event) { event.stopPropagation(); }, true);
    modal.addEventListener("keypress", function (event) { event.stopPropagation(); }, true);
    modal.querySelector('[data-role="cancel"]').addEventListener("click", close);
    modal.querySelector('[data-role="form"]').addEventListener("submit", function (event) {
      event.preventDefault();
      if (event.isComposing) return;
      var text = input.value.trim();
      if (method !== "ReceiveMobileHorseSearch" && !text) {
        error.textContent = "名前を入力してください。";
        input.focus();
        return;
      }
      if (text.indexOf("<") !== -1 || text.indexOf(">") !== -1) {
        error.textContent = "< と > は使用できません。";
        input.focus();
        return;
      }
      if (send(method, text)) close();
      else error.textContent = "ゲームの読み込みが完了していません。";
    });
    return modal;
  }

  function close() {
    if (!modal) return;
    modal.remove();
    document.body.style.overflow = oldOverflow;
    modal = null;
    input = null;
    method = null;
    send("IdentityInputFocus", "0");
  }

  window.HorseDaysIdentityInput = function (callbackMethod, currentValue, limit) {
    if (!Object.prototype.hasOwnProperty.call(inputKinds, callbackMethod)) {
      console.warn("HorseDays: unsupported input callback", callbackMethod);
      return;
    }
    if (modal) close();
    method = callbackMethod;
    var settings = inputKinds[method];
    var max = Math.max(1, Math.min(100, Number(limit) || 24));
    makeModal();
    modal.querySelector('[data-role="title"]').textContent = settings.title;
    modal.querySelector('[data-role="error"]').textContent = "";
    input.placeholder = settings.placeholder;
    input.maxLength = max;
    input.value = String(currentValue || "").slice(0, max);
    oldOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.body.appendChild(modal);
    send("IdentityInputFocus", "1");
    var canvas = document.getElementById("unity-canvas");
    if (canvas && typeof canvas.blur === "function") canvas.blur();
    // Focus directly in the click gesture for iOS; the visible field can also
    // be tapped again if a browser prevents auto-opening the soft keyboard.
    input.focus();
    input.select();
  };
})();

</script>

      ctx.restore();
      var dominant=(r.rank||99)<=3;
      if(dominant){ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#193f39';ctx.strokeStyle='#fffceb';ctx.lineWidth=3;ctx.strokeText(String(r.number||'?'),x,y-13);ctx.fillText(String(r.number||'?'),x,y-13)}
    });
    // Finish line on oval, clear high-contrast checkers.
    var fX=cx+rx,fY=cy;
    ctx.save();ctx.translate(fX,fY);ctx.rotate(Math.PI/2);for(var x0=0;x0<8;x0++)for(var y0=0;y0<2;y0++){ctx.fillStyle=(x0+y0)%2?'#1b332b':'#fff';ctx.fillRect(-10+x0*3,-8+y0*8,3,8)}ctx.restore();
    // Screen-space race progress bar.
    ctx.fillStyle='#fff9';ctx.fillRect(15,h-29,w-30,8);ctx.fillStyle='#c3a161';ctx.fillRect(15,h-29,(w-30)*Math.min(1,leadRan/dist),8);
    ctx.font='700 10px system-ui';ctx.textAlign='left';ctx.fillStyle='#234238';ctx.fillText('START',15,h-34);ctx.textAlign='right';ctx.fillText('GOAL',w-15,h-34);
    if(frame.paused){ctx.fillStyle='#102f28b8';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.font='800 25px system-ui';ctx.fillStyle='#fff';ctx.fillText('一時停止中',w/2,h/2)}
  }
  function updateUI(){if(!root||!frame)return;
    var a=Array.isArray(frame.runners)?frame.runners.slice():[];a.sort(function(x,y){return (x.rank||99)-(y.rank||99)});
    var lead=a[0], remain=Math.max(0,Math.ceil((Number(frame.distance)||0)-(lead?Number(lead.ran)||0:0)));
    root.querySelector('.hd-name').textContent=safeText(frame.name)||'レース観戦';
    root.querySelector('.hd-meta').textContent=[frame.venue,frame.courseName,frame.going].filter(Boolean).join(' · ');
    root.querySelector('[data-stat="remaining"]').textContent=remain+'m';
    root.querySelector('[data-stat="leader"]').textContent=lead?(lead.number||'—')+'番':'—';
    root.querySelector('[data-stat="count"]').textContent=a.length+'頭';
    while(info.firstChild)info.removeChild(info.firstChild);
    a.slice(0,3).forEach(function(r,i){var chip=document.createElement('span');chip.className='hd-chip';chip.textContent=(i+1)+'着 '+(r.number||'?');info.appendChild(chip);var nm=document.createElement('span');nm.textContent=safeText(r.name);info.appendChild(nm)});
    var btn=root.querySelector('[data-act="1"]');if(btn)btn.textContent=frame.paused?'再開':'一時停止';
    var sp=root.querySelector('[data-act="2"]');if(sp)sp.textContent=(Number(frame.rate)||1)>1?'等速':'2倍速';
    draw();
  }
  function loop(time){if(!active)return;if(time-lastDraw>60){lastDraw=time;draw()}raf=window.requestAnimationFrame(loop)}
  function show(v){var f=parseFrame(v);if(!f||!Array.isArray(f.runners))return 0;try{make();frame=f;root.style.display='flex';active=true;commandPending=0;updateUI();if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);return 1}catch(e){console.error('HorseDays 2D race display failed',e);hide();return 0}}
  function update(v){var f=parseFrame(v);if(!f||!active)return;frame=f;updateUI();}
  function command(){var c=commandPending;commandPending=0;return c;}
  function hide(){active=false;frame=null;commandPending=0;if(raf)cancelAnimationFrame(raf);raf=0;if(root){root.remove();root=null;paper=null;ctx=null;info=null;}}
  window.HorseDaysInkRace={show:show,update:update,command:command,hide:hide,__hdVersion:'1.0'};
})();

</script>
